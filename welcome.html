<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forensa AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --space:  #080C18;
  --cyan:   #00C2D4;
  --amber:  #E8A030;
  --text:   #F4F8FF;
  --muted:  #4a5a7a;
  --dim:    #1a2a42;
}

html,body{
  height:100%;
  background:var(--space);
  overflow:hidden;
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── Main stage ── */
.stage{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* ── Ambient background ── */
.bg-glow{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(90px);
}
.bg-glow-1{
  width:600px;height:600px;
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  background:radial-gradient(circle,rgba(0,194,212,0.07) 0%,transparent 70%);
}
.bg-glow-2{
  width:300px;height:300px;
  bottom:10%;right:15%;
  background:radial-gradient(circle,rgba(232,160,48,0.04) 0%,transparent 70%);
}

/* ── Subtle grid ── */
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,194,212,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,194,212,0.03) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 0%,transparent 100%);
  pointer-events:none;
}

/* ── Content ── */
.content{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  position:relative;
  z-index:2;
}

/* ── Mark ── */
.mark-wrap{
  width:80px;height:80px;
  position:relative;
  margin-bottom:36px;
}
.mark-halo{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:180px;height:180px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,194,212,0.10) 0%,transparent 70%);
  pointer-events:none;
}

/* Hex paths — draw-on animation */
.hp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hp1{
  stroke:var(--cyan);stroke-width:2;
  stroke-dasharray:200;stroke-dashoffset:200;
  animation:draw 0.75s 0.1s cubic-bezier(0.4,0,0.2,1) forwards;
}
.hp2{
  stroke:var(--cyan);stroke-width:2;opacity:0.55;
  stroke-dasharray:200;stroke-dashoffset:200;
  animation:draw 0.75s 0.65s cubic-bezier(0.4,0,0.2,1) forwards;
}
.hp3{
  stroke:var(--amber);stroke-width:2;opacity:0.9;
  stroke-dasharray:200;stroke-dashoffset:200;
  animation:draw 0.75s 1.1s cubic-bezier(0.4,0,0.2,1) forwards;
}
.hc{stroke:var(--cyan);stroke-width:1.2;stroke-linecap:round;opacity:0;animation:fi 0.4s 1.8s ease forwards}
.hdot{fill:var(--cyan);opacity:0;animation:fi 0.3s 2.0s ease forwards}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fi{to{opacity:1}}

/* ── Wordmark ── */
.wordmark{
  font-family:'Syne',sans-serif;
  font-size:42px;font-weight:700;
  letter-spacing:-0.04em;
  color:var(--text);
  opacity:0;
  animation:rise 0.7s 1.6s cubic-bezier(0.4,0,0.2,1) forwards;
  margin-bottom:14px;
}
.wordmark span{color:var(--cyan);font-weight:500}

/* ── Tagline ── */
.tagline{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.20em;
  color:var(--muted);
  text-transform:uppercase;
  opacity:0;
  animation:rise 0.6s 2.0s ease forwards;
  margin-bottom:52px;
}

/* ── Progress bar ── */
.progress-wrap{
  width:200px;
  opacity:0;
  animation:fi 0.4s 2.2s ease forwards;
}
.progress-track{
  height:1px;
  background:var(--dim);
  border-radius:1px;
  overflow:hidden;
  margin-bottom:12px;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--cyan),var(--amber));
  border-radius:1px;
  animation:fill 2.4s 2.3s cubic-bezier(0.4,0,0.2,1) forwards;
}
.progress-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:0.14em;
  color:var(--muted);
  text-align:center;
  text-transform:uppercase;
}

/* ── Skip link ── */
.skip{
  position:absolute;
  bottom:36px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:0.12em;
  color:var(--dim);
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
  opacity:0;
  animation:fi 0.4s 2.8s ease forwards;
  transition:color 0.2s;
  z-index:10;
}
.skip:hover{color:var(--muted)}

/* ── Exit animation ── */
.stage.exit{
  animation:exit 0.65s cubic-bezier(0.4,0,0.8,0.2) forwards;
}
@keyframes exit{
  0%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.03)}
}

@keyframes rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fill{
  to{width:100%}
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important}
}
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-grid"></div>

  <div class="content">

    <!-- Hexagon mark -->
    <div class="mark-wrap">
      <div class="mark-halo"></div>
      <svg width="80" height="80" viewBox="0 0 96 96" fill="none">
        <path class="hp hp1" d="M30 14 L42 7 L54 14 L54 28 L42 35 L30 28 Z"/>
        <path class="hp hp2" d="M12 42 L24 35 L36 42 L36 56 L24 63 L12 56 Z"/>
        <path class="hp hp3" d="M48 42 L60 35 L72 42 L72 56 L60 63 L48 56 Z"/>
        <line class="hc" x1="42" y1="35" x2="36" y2="42"/>
        <line class="hc" x1="54" y1="28" x2="60" y2="35"/>
        <line class="hc" x1="36" y1="56" x2="48" y2="56"/>
        <circle class="hdot" cx="48" cy="42" r="2.5"/>
      </svg>
    </div>

    <!-- Wordmark -->
    <div class="wordmark">forensa<span>.ai</span></div>

    <!-- Tagline -->
    <div class="tagline">AI Agent Governance · ASEAN</div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="pfill"></div>
      </div>
      <div class="progress-label" id="plabel">Initialising</div>
    </div>

  </div>

  <a class="skip" id="skip" href="index.html">Enter dashboard →</a>

</div>

<script>
const labels = [
  'Initialising',
  'Loading compliance rules',
  'Verifying audit chain',
  'Connecting to ledger',
  'Ready'
];

let li = 0;
const plabel = document.getElementById('plabel');

// Cycle status labels
const labelInterval = setInterval(() => {
  li++;
  if (li < labels.length) {
    plabel.style.opacity = '0';
    setTimeout(() => {
      plabel.textContent = labels[li];
      plabel.style.opacity = '1';
      plabel.style.transition = 'opacity 0.3s';
    }, 150);
  } else {
    clearInterval(labelInterval);
  }
}, 580);

// Auto-navigate after animations complete
setTimeout(() => {
  const stage = document.getElementById('stage');
  stage.classList.add('exit');
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 650);
}, 5200);

// Skip click
document.getElementById('skip').addEventListener('click', (e) => {
  e.preventDefault();
  clearInterval(labelInterval);
  const stage = document.getElementById('stage');
  stage.classList.add('exit');
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 650);
});
</script>

</body>
</html>
