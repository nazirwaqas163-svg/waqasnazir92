<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Governance Ledger</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-elevated: #111827;
      --bg-card: #151d2e;
      --border: #243044;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0ea5e9;
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.12);
      --ok: #34d399;
      --ok-bg: rgba(52, 211, 153, 0.12);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(52, 211, 153, 0.06), transparent);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 420px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .status-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .status-card h2 {
      margin: 0 0 8px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }

    .status-card .value {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .status-card .value.state-closed { color: var(--ok); }
    .status-card .value.state-half-open { color: var(--warn); }
    .status-card .value.state-open { color: var(--danger); }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-kill {
      background: #dc2626;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 4px 18px rgba(220, 38, 38, 0.5);
      border: 2px solid #f87171;
    }

    .btn-kill:hover:not(:disabled) {
      background: #ef4444;
      box-shadow: 0 6px 22px rgba(239, 68, 68, 0.55);
    }

    .btn-reset {
      background: var(--bg-card);
      color: var(--ok);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 2px solid rgba(52, 211, 153, 0.5);
    }

    .btn-reset:hover:not(:disabled) {
      background: var(--ok-bg);
      border-color: var(--ok);
    }

    .btn-ghost {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .stats-row strong {
      color: var(--text);
      font-weight: 600;
    }

    .error-message {
      margin-bottom: 16px;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
    }

    .success-message {
      margin-bottom: 16px;
      color: var(--ok);
      background: var(--ok-bg);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
    }

    .table-wrapper {
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      background: var(--bg-elevated);
      font-weight: 600;
    }

    tr:last-child td { border-bottom: none; }

    tr.row-allowed td {
      background: rgba(52, 211, 153, 0.1);
      border-left: 3px solid var(--ok);
    }

    tr.row-blocked td {
      background: rgba(248, 113, 113, 0.12);
      border-left: 3px solid var(--danger);
    }

    tr.row-allowed:hover td { background: rgba(52, 211, 153, 0.16); }
    tr.row-blocked:hover td { background: rgba(248, 113, 113, 0.18); }
    tr:not(.row-allowed):not(.row-blocked):hover td { background: rgba(56, 189, 248, 0.04); }

    .status-code {
      font-family: ui-monospace, monospace;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .status-code.s-200 { color: var(--ok); }
    .status-code.s-409,
    .status-code.s-403,
    .status-code.s-423 { color: var(--danger); }

    td { font-size: 0.88rem; color: var(--text); }
    .muted { color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-allowed {
      color: var(--ok);
      background: var(--ok-bg);
      border: 1px solid rgba(52, 211, 153, 0.35);
    }

    .badge-blocked {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }

    .badge-neutral {
      color: var(--muted);
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid var(--border);
    }

    .kind-tag {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--accent);
    }

    td pre {
      white-space: pre-wrap;
      max-height: 100px;
      overflow: auto;
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--bg);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .empty-state {
      padding: 48px;
      text-align: center;
      color: var(--muted);
    }

    .api-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 20px;
      text-align: center;
    }

    .api-hint code {
      color: var(--accent);
      background: var(--bg-elevated);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div class="brand">
        <h1>Pulse Governance Ledger</h1>
        <p>AI agent swarm governance — circuit breaker, BDI scoring, and policy enforcement.</p>
      </div>
      <div class="controls">
        <button type="button" class="btn btn-ghost" id="btn-refresh">Refresh</button>
        <button type="button" class="btn btn-reset" id="btn-reset-breaker">Reset Breaker</button>
        <button type="button" class="btn btn-kill" id="btn-kill-switch">Trip Kill Switch</button>
      </div>
    </div>

    <div class="status-grid">
      <div class="status-card">
        <h2>Health</h2>
        <p class="value" id="health-status">Loading…</p>
      </div>
      <div class="status-card">
        <h2>Circuit Breaker</h2>
        <p class="value" id="cb-status">Loading…</p>
      </div>
      <div class="status-card">
        <h2>Failures</h2>
        <p class="value" id="cb-failures">—</p>
      </div>
    </div>

    <div id="error" class="error-message" style="display:none;"></div>
    <div id="success" class="success-message" style="display:none;"></div>

    <div class="stats-row" id="event-stats">
      <span>Allowed: <strong id="stat-allowed">0</strong></span>
      <span>Blocked: <strong id="stat-blocked">0</strong></span>
      <span>Total events: <strong id="stat-total">0</strong></span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Decision</th>
            <th>Timestamp</th>
            <th>Kind</th>
            <th>Text</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="events-body">
          <tr><td colspan="6" class="empty-state">Loading events…</td></tr>
        </tbody>
      </table>
    </div>

    <p class="api-hint">API: <code id="api-base-label"></code></p>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost'
      ? 'http://127.0.0.1:8000'
      : 'https://pulse-proxy-je0p.onrender.com'

    const EVENTS_URL = `${API_BASE}/events`
    const HEALTH_URL = `${API_BASE}/health`
    const CB_URL = `${API_BASE}/circuit-breaker/status`
    const CB_OPEN_URL = `${API_BASE}/circuit-breaker/open`
    const CB_CLOSE_URL = `${API_BASE}/circuit-breaker/close`

    const healthStatus = document.getElementById('health-status')
    const cbStatus = document.getElementById('cb-status')
    const cbFailures = document.getElementById('cb-failures')
    const eventsBody = document.getElementById('events-body')
    const errorBox = document.getElementById('error')
    const successBox = document.getElementById('success')
    const btnKill = document.getElementById('btn-kill-switch')
    const btnReset = document.getElementById('btn-reset-breaker')
    const btnRefresh = document.getElementById('btn-refresh')
    const statAllowed = document.getElementById('stat-allowed')
    const statBlocked = document.getElementById('stat-blocked')
    const statTotal = document.getElementById('stat-total')
    const apiBaseLabel = document.getElementById('api-base-label')

    if (apiBaseLabel) apiBaseLabel.textContent = API_BASE

    function renderError(message) {
      if (!errorBox) return
      errorBox.textContent = message
      errorBox.style.display = message ? 'block' : 'none'
      if (message && successBox) successBox.style.display = 'none'
    }

    function renderSuccess(message) {
      if (!successBox) return
      successBox.textContent = message
      successBox.style.display = message ? 'block' : 'none'
      if (message && errorBox) errorBox.style.display = 'none'
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function eventDecision(event) {
      const data = event.data || {}
      if (data.decision === 'blocked' || data.decision === 'allowed') {
        return data.decision
      }
      if (typeof data.allowed === 'boolean') {
        return data.allowed ? 'allowed' : 'blocked'
      }
      if (event.kind === 'governance') {
        const state = (data.state && (data.state.value || data.state)) || ''
        const normalized = String(state).toLowerCase()
        if (normalized === 'open' || normalized === 'half-open') return 'blocked'
        if (normalized === 'closed') return 'allowed'
        if (event.text === 'request-blocked') return 'blocked'
      }
      if (event.kind === 'input' || event.kind === 'output' || event.kind === 'tool_call') {
        return 'allowed'
      }
      return 'neutral'
    }

    function eventStatusCode(event) {
      const data = event.data || {}
      if (data.status_code != null) return Number(data.status_code)
      const decision = eventDecision(event)
      if (decision === 'blocked') return 409
      if (decision === 'allowed') return 200
      return null
    }

    function rowClass(event) {
      const code = eventStatusCode(event)
      if (code === 200) return 'row-allowed'
      if (code === 409 || code === 403 || code === 423) return 'row-blocked'
      const decision = eventDecision(event)
      if (decision === 'allowed') return 'row-allowed'
      if (decision === 'blocked') return 'row-blocked'
      return ''
    }

    function statusCodeCell(code) {
      if (code == null) return '<span class="muted">—</span>'
      const cls = `status-code s-${code}`
      return `<span class="${cls}">${code}</span>`
    }

    function decisionBadge(decision, statusCode) {
      if (decision === 'allowed') {
        return `<span class="badge badge-allowed">Allowed${statusCode === 200 ? ' (200)' : ''}</span>`
      }
      if (decision === 'blocked') {
        const label = statusCode === 423 ? '423' : statusCode === 403 ? '403' : '409'
        return `<span class="badge badge-blocked">Blocked (${label})</span>`
      }
      return '<span class="badge badge-neutral">—</span>'
    }

    function cbStateClass(state) {
      const s = String(state || '').toLowerCase()
      if (s === 'closed') return 'state-closed'
      if (s === 'half-open') return 'state-half-open'
      if (s === 'open') return 'state-open'
      return ''
    }

    function updateEventStats(events) {
      let allowed = 0
      let blocked = 0
      for (const event of events) {
        const d = eventDecision(event)
        if (d === 'allowed') allowed += 1
        else if (d === 'blocked') blocked += 1
      }
      if (statAllowed) statAllowed.textContent = String(allowed)
      if (statBlocked) statBlocked.textContent = String(blocked)
      if (statTotal) statTotal.textContent = String(events.length)
    }

    function renderEvents(events) {
      if (!eventsBody) return
      if (!events || events.length === 0) {
        eventsBody.innerHTML = '<tr><td colspan="6" class="empty-state">No events available.</td></tr>'
        updateEventStats([])
        return
      }

      updateEventStats(events)

      eventsBody.innerHTML = events.map(event => {
        const decision = eventDecision(event)
        const statusCode = eventStatusCode(event)
        const text = event.text ? escapeHtml(event.text) : '<span class="muted">(no text)</span>'
        const data = event.data ? escapeHtml(JSON.stringify(event.data, null, 0)) : '<span class="muted">(no data)</span>'
        return `
          <tr class="${rowClass(event)}">
            <td>${statusCodeCell(statusCode)}</td>
            <td>${decisionBadge(decision, statusCode)}</td>
            <td>${escapeHtml(new Date(event.created_at).toLocaleString())}</td>
            <td><span class="kind-tag">${escapeHtml(event.kind)}</span></td>
            <td>${text}</td>
            <td><pre>${data}</pre></td>
          </tr>`
      }).join('')
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, { cache: 'no-store', ...options })
      if (!response.ok) {
        let detail = `status ${response.status}`
        try {
          const body = await response.json()
          detail = body.detail || body.message || JSON.stringify(body)
        } catch (_) { /* ignore */ }
        throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail))
      }
      return response.json()
    }

    async function refreshStatus() {
      try {
        const [healthData, cbData] = await Promise.all([
          fetchJson(HEALTH_URL),
          fetchJson(CB_URL)
        ])
        if (healthStatus) {
          healthStatus.textContent = healthData.ok ? 'OK' : 'Unhealthy'
          healthStatus.className = 'value ' + (healthData.ok ? 'state-closed' : 'state-open')
        }
        if (cbStatus) {
          const state = cbData.state ?? cbData.circuit_breaker?.state ?? 'unknown'
          cbStatus.textContent = String(state)
          cbStatus.className = 'value ' + cbStateClass(state)
        }
        if (cbFailures) {
          cbFailures.textContent = String(cbData.failure_count ?? 0)
        }
        renderError('')
      } catch (err) {
        renderError('Unable to load health or circuit breaker status. ' + err.message)
        if (healthStatus) { healthStatus.textContent = 'Error'; healthStatus.className = 'value' }
        if (cbStatus) { cbStatus.textContent = 'Error'; cbStatus.className = 'value' }
      }
    }

    async function refreshEvents() {
      try {
        const data = await fetchJson(EVENTS_URL)
        renderEvents(data.events || [])
      } catch (err) {
        renderError('Unable to load events. ' + err.message)
        if (eventsBody) {
          eventsBody.innerHTML = '<tr><td colspan="6" class="empty-state">Unable to load events.</td></tr>'
        }
      }
    }

    async function tripKillSwitch() {
      if (!btnKill) return
      const confirmed = window.confirm(
        'Trip the kill switch?\n\nThis will open the circuit breaker and block agent traffic until reset on the server.'
      )
      if (!confirmed) return

      btnKill.disabled = true
      btnKill.textContent = 'Tripping…'
      try {
        const result = await fetchJson(CB_OPEN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reason: 'Manual kill switch activated from dashboard',
            bdi_score: 1.0,
            entropy: 0.0
          })
        })
        const state = result.state || 'open'
        renderSuccess(`✓ Kill switch tripped — circuit breaker is now "${state}" (HTTP 409).`)
        window.alert(`Kill switch tripped successfully.\n\nCircuit breaker state: ${state}`)
        await Promise.all([refreshStatus(), refreshEvents()])
      } catch (err) {
        renderError('Kill switch request failed. ' + err.message)
      } finally {
        btnKill.disabled = false
        btnKill.textContent = 'TRIP KILL SWITCH'
      }
    }

    async function resetBreaker() {
      if (!btnReset) return
      const confirmed = window.confirm(
        'Reset the circuit breaker?\n\nThis will return the breaker to CLOSED and allow agent traffic.'
      )
      if (!confirmed) return

      btnReset.disabled = true
      btnReset.textContent = 'Resetting…'
      try {
        const result = await fetchJson(CB_CLOSE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reason: 'Manual reset from dashboard',
            bdi_score: 0.0,
            entropy: 0.0
          })
        })
        const state = result.state || 'closed'
        renderSuccess(`✓ Circuit breaker reset — state is now "${state}" (HTTP 200).`)
        window.alert(`Circuit breaker reset successfully.\n\nCircuit breaker state: ${state}`)
        await Promise.all([refreshStatus(), refreshEvents()])
      } catch (err) {
        renderError('Reset breaker request failed. ' + err.message)
      } finally {
        btnReset.disabled = false
        btnReset.textContent = 'RESET BREAKER'
      }
    }

    async function refreshAll() {
      await Promise.all([refreshStatus(), refreshEvents()])
    }

    if (btnKill) btnKill.addEventListener('click', tripKillSwitch)
    if (btnReset) btnReset.addEventListener('click', resetBreaker)
    if (btnRefresh) btnRefresh.addEventListener('click', refreshAll)

    if (btnKill) btnKill.textContent = 'TRIP KILL SWITCH'
    if (btnReset) btnReset.textContent = 'RESET BREAKER'

    refreshAll()
    setInterval(refreshStatus, 30000)
    setInterval(refreshEvents, 10000)
  </script>
</body>
</html>
